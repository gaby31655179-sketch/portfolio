<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="張哲瑋 Che-Wei Chang 的作品與履歷。">
  <meta name="theme-color" content="#101820">
  <title>張哲瑋｜作品與履歷</title>
  <style>
    :root{color-scheme:dark;--bg:#101820;--panel:#17222a;--text:#edf0eb;--muted:#a6b3b9;--accent:#b7d6c6;--line:#ffffff18}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei",system-ui,sans-serif;line-height:1.8}h1,h2,h3,p{margin:0}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.wrap{width:min(1000px,calc(100% - 40px));margin:auto}.nav{position:sticky;top:0;z-index:10;background:#101820ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav-inner{height:70px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:600}.brand span{font-weight:400;font-size:12px;color:var(--muted);margin-left:10px}nav{display:flex;gap:25px;font-size:14px;color:var(--muted)}nav a:hover{color:var(--text)}.intro{padding:65px 0 45px}.label{font-size:12px;color:var(--accent);letter-spacing:.08em}h1{font-size:clamp(32px,5vw,48px);font-weight:600;margin-top:12px;letter-spacing:.02em}.intro p:last-child{color:var(--muted);font-size:15px;margin-top:12px}.section{padding:40px 0 55px;border-top:1px solid var(--line)}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h2{font-size:27px;font-weight:600}.section-heading span{color:var(--muted);font-size:12px}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#b7d6c64a}.cover{height:150px;background:#b7d6c609;border-bottom:1px solid var(--line);display:grid;place-items:center;color:#b7d6c6;font:32px Georgia,serif}.cover img{width:100%;height:100%;object-fit:cover}.card-body{padding:22px}.card h3{font-size:17px;margin-bottom:10px;font-weight:600}.card p{font-size:13px;color:var(--muted)}.pending{display:inline-block;margin-top:18px;font-size:12px;color:#91a5aa}.project-link{display:inline-block;margin-top:18px;font-size:13px;color:var(--accent)}.resume{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px}.resume-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:25px;border-bottom:1px solid var(--line)}.resume-name{font-size:24px;font-weight:600}.english{font-size:13px;color:var(--muted)}.subtitle{font-size:14px;color:var(--accent);margin-top:8px}.download{display:inline-flex;padding:10px 18px;border:1px solid #b7d6c650;border-radius:8px;color:var(--accent);font-size:13px}.download:hover{background:#b7d6c609}.download[aria-disabled="true"]{color:var(--muted);border-color:var(--line);cursor:default}.resume-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-top:25px}.resume-grid h3{font-size:15px;font-weight:600;margin-bottom:8px}.resume-grid p{color:var(--muted);font-size:14px}.resume-grid .hint{font-size:12px;color:#91a5aa;margin-top:7px}.footer{padding:24px 0;border-top:1px solid var(--line);font-size:12px;color:#91a5aa}.skip{position:fixed;top:-100px;left:16px;background:var(--panel);padding:8px 15px;z-index:30}.skip:focus{top:10px}
    @media(max-width:700px){.brand span{display:none}.intro{padding:40px 0 30px}.projects{grid-template-columns:1fr}.cover{height:120px}.section{padding:30px 0 40px}.resume{padding:24px}.resume-header{align-items:flex-start;flex-direction:column;gap:18px}.resume-grid{grid-template-columns:1fr;gap:22px}.section-heading span{display:none}h2{font-size:24px}}
    .resume-grid p,.card-body p{white-space:pre-line;overflow-wrap:anywhere}.empty-state{color:var(--muted);font-size:14px;grid-column:1/-1}.project-link+.project-link{margin-left:14px}.footer .wrap{display:flex;justify-content:space-between;gap:15px}.manage-link{color:var(--muted)}
    @media(max-width:700px){#brand-name{display:inline}.footer .wrap{flex-wrap:wrap}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
</head>
<body>
  <a class="skip" href="#main">跳至主要內容</a>
  <header class="nav"><div class="wrap nav-inner"><a class="brand" href="#main"><span id="brand-name" style="font-size:inherit;color:inherit;margin:0">張哲瑋</span><span id="brand-english">Che-Wei Chang</span></a><nav aria-label="主要導覽"><a href="#projects">作品</a><a href="#resume">履歷</a></nav></div></header>
  <main class="wrap" id="main">
    <div class="intro"><p class="label" id="intro-name">張哲瑋 / Che-Wei Chang</p><h1>作品與履歷</h1></div>
    <section class="section" id="projects" aria-labelledby="projects-title"><div class="section-heading"><h2 id="projects-title">作品</h2><span>Portfolio</span></div><div class="projects" id="project-grid">
      <article class="card"><div class="cover" aria-hidden="true">01</div><div class="card-body"><h3>作品一</h3><p>作品名稱、簡介與檔案待加入。</p><span class="pending">待加入</span></div></article>
      <article class="card"><div class="cover" aria-hidden="true">02</div><div class="card-body"><h3>作品二</h3><p>作品名稱、簡介與檔案待加入。</p><span class="pending">待加入</span></div></article>
      <article class="card"><div class="cover" aria-hidden="true">03</div><div class="card-body"><h3>作品三</h3><p>作品名稱、簡介與檔案待加入。</p><span class="pending">待加入</span></div></article>
    </div></section>
    <section class="section" id="resume" aria-labelledby="resume-title"><div class="section-heading"><h2 id="resume-title">履歷</h2><span>Resume</span></div><div class="resume"><div class="resume-header"><div><p class="resume-name" id="resume-name">張哲瑋</p><p class="english" id="resume-english">Che-Wei Chang</p></div><a class="download" id="resume-download" aria-disabled="true">履歷 PDF 待加入</a></div><div class="resume-grid"><div><h3>學歷</h3><p id="resume-education">經濟學碩士在學</p></div><div><h3>研究方向</h3><p id="resume-research">待補充</p></div><div><h3>經歷</h3><p id="resume-experience">待補充</p></div><div><h3>技能</h3><p id="resume-skills">待補充</p></div><div><h3>聯絡方式</h3><p id="resume-email">待補充</p></div></div></div></section>
  </main>
  <footer class="footer"><div class="wrap"><span>© <span id="year">2026</span> <span id="footer-name">張哲瑋</span></span><a class="manage-link" href="admin/">管理內容</a></div></footer>
  <!-- CONTENT_DATA -->
  <script>
    'use strict';
    // 上線時由 GitHub 將 CMS 儲存的資料加入；本機直接開啟則顯示預設資料。
    const PROFILE = window.PORTFOLIO_CONTENT?.profile || { name:'張哲瑋', englishName:'Che-Wei Chang', title:'經濟學碩士生', education:'經濟學碩士在學\n學校名稱與就讀年份待補。', resumeUrl:'', email:'' };
    const PROJECTS = window.PORTFOLIO_CONTENT?.projects || [
      { title: '作品一', description: '作品名稱、簡介與檔案待加入。', url: '', image: '' },
      { title: '作品二', description: '作品名稱、簡介與檔案待加入。', url: '', image: '' },
      { title: '作品三', description: '作品名稱、簡介與檔案待加入。', url: '', image: '' }
    ];
    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function safeURL(value) {
      if(typeof value !== 'string' || !value.trim()) return '';
      // CMS 的 /uploads 路徑須相對於網站資料夾，支援 username.github.io/repo/。
      const relative = value.startsWith('/uploads/') ? `.${value}` : value;
      try { const url = new URL(relative, location.href); return ['https:', 'http:'].includes(url.protocol) || location.protocol === 'file:' && url.protocol === 'file:' ? url.href : ''; } catch { return ''; }
    }
    function renderProjects() {
      document.querySelector('#project-grid').innerHTML = PROJECTS.map((item, index) => {
        const url = safeURL(item.url), image = safeURL(item.image), file = safeURL(item.file);
        const links = `${file ? `<a class="project-link" href="${escapeHTML(file)}" target="_blank" rel="noopener noreferrer">閱讀作品 PDF ↗</a>` : ''}${url ? `<a class="project-link" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">查看作品 ↗</a>` : ''}`;
        return `<article class="card"><div class="cover">${image ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(item.title)}作品預覽" loading="lazy">` : `<span aria-hidden="true">${String(index + 1).padStart(2, '0')}</span>`}</div><div class="card-body"><h3>${escapeHTML(item.title)}</h3><p>${escapeHTML(item.description || '')}</p>${links || '<span class="pending">待加入</span>'}</div></article>`;
      }).join('') || '<p class="empty-state">作品即將加入。</p>';
    }
    function renderResume() {
      const link = document.querySelector('#resume-download'), url = safeURL(PROFILE.resumeUrl);
      if(url) { link.href = url; link.textContent = '下載履歷 PDF ↓'; link.removeAttribute('aria-disabled'); link.setAttribute('download', 'Che-Wei-Chang-Resume.pdf'); link.target = '_blank'; link.rel = 'noopener noreferrer'; }
      else { link.removeAttribute('href'); link.textContent = '履歷 PDF 待加入'; link.setAttribute('aria-disabled', 'true'); }
      const fields = {name:'name',english:'englishName',education:'education',research:'research',experience:'experience',skills:'skills',email:'email'};
      for(const [id, field] of Object.entries(fields)) document.querySelector(`#resume-${id}`).textContent = PROFILE[field] || '待補充';
      document.querySelector('#brand-name').textContent = PROFILE.name || '';
      document.querySelector('#brand-english').textContent = PROFILE.englishName || '';
      document.querySelector('#intro-name').textContent = [PROFILE.name, PROFILE.englishName].filter(Boolean).join(' / ');
      document.querySelector('#footer-name').textContent = PROFILE.name || '';
      document.title = `${PROFILE.name || ''}｜作品與履歷`;
    }
    document.querySelector('#year').textContent = new Date().getFullYear();
    renderProjects(); renderResume();
  </script>
</body>
</html>
