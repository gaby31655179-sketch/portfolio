name: Check and publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        if: vars.ENABLE_PAGES == 'true'
      - name: Build website
        run: node build.cjs
      - name: Check website
        run: node verify.cjs
      - uses: actions/upload-pages-artifact@v4
        if: vars.ENABLE_PAGES == 'true'
        with:
          path: _site
  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
